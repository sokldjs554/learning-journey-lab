name: Full public-data reproduction
on:
  push:
    paths:
      - 'sql/**'
      - 'src/**'
      - 'scripts/analyze.py'
      - 'data/manifest.json'
      - '.github/workflows/full-reproduction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/download.py
      - run: python scripts/analyze.py
      - run: python scripts/crosscheck.py
      - run: python scripts/build.py
      - run: python scripts/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-data-evidence
          path: |
            reports/report.json
            reports/crosscheck.json
            reports/issues.json
            work/latest_run.json
