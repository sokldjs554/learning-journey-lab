name: Deployed browser engines
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/cross_browser_check.py'
      - '.github/workflows/browser-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/cross_browser_check.py --browser ${{ matrix.browser }} --output work/browser-${{ matrix.browser }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: work/browser-${{ matrix.browser }}.json
